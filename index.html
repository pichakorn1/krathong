<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลอยกระทงด้วยกัน</title>
<script defer src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
VOICE: tender, quiet, a little playful — two people on one pier.
IDEA: a night river postcard you can step into.
PICTURE: Wat Arun lit gold under a full moon, the couple's backs on the pier, krathongs drifting.
COLOUR and TYPE: night indigo, temple gold, candle amber; Mitr + IBM Plex Sans Thai.
LAYOUT: scene fills the screen, a small glass card at the bottom holds the three steps.
*/
:root{color-scheme:dark;--bg:#070b22;--ink:#f6efe2;--mute:#b9b3c9;--gold:#f3c46b;--glass:rgba(12,16,44,.78);--line:rgba(243,196,107,.28)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
h1,h2,.btn,.chip{font-family:Mitr,"IBM Plex Sans Thai",sans-serif;font-weight:500}
#stage{position:relative;flex:1;min-height:300px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.top{position:absolute;inset:12px 14px auto;transition:opacity .6s;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.top h1{margin:0;white-space:nowrap;font-size:clamp(20px,4.4vw,30px);line-height:1.1;text-shadow:0 2px 12px #000a}
.top p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.who{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#2a2f5a}
.dot{width:8px;height:8px;border-radius:50%;background:#565c80}
.dot.on{background:#8fe3a2;box-shadow:0 0 8px #8fe3a2}
#bubble{position:absolute;max-width:min(260px,70vw);padding:10px 12px;border-radius:14px;background:rgba(255,248,232,.95);color:#2a1d10;font-size:14px;line-height:1.45;transform:translate(-50%,calc(-100% - 14px));pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 6px 24px #0008;overflow-wrap:anywhere}
#bubble.show{opacity:1}
#bubble b{font-family:Mitr,sans-serif;font-weight:500;display:block;font-size:13px;color:#9a5a12}
.panel{background:linear-gradient(#0b0f2c,#070a20);border-top:1px solid var(--line);padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom))}
.inner{max-width:640px;margin:0 auto;display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:13px;color:var(--mute)}
.lbl b{color:var(--gold);font-weight:500}
.kinds{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.kind{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:14px;padding:4px 2px 6px;color:var(--ink);font:13px "IBM Plex Sans Thai",sans-serif;cursor:pointer;min-height:44px;display:grid;justify-items:center;gap:0}
.kind canvas{width:100%;max-width:96px;aspect-ratio:3/2}
.kind[aria-pressed=true]{border-color:var(--gold);background:rgba(243,196,107,.12)}
.kind:focus-visible,.btn:focus-visible,textarea:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wish{display:flex;gap:8px;align-items:stretch}
textarea{flex:1;resize:none;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--ink);font:16px/1.4 "IBM Plex Sans Thai",sans-serif;padding:8px 12px}
textarea::placeholder{color:#8f8aa5}
.btn{border:0;border-radius:14px;padding:0 18px;min-height:52px;background:linear-gradient(#f7d27f,#e6a843);color:#2b1704;font-size:17px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 18px rgba(243,196,107,.3)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none;min-height:44px;font-size:15px}
.link{background:none;border:0;color:var(--gold);font:13px "IBM Plex Sans Thai",sans-serif;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.count{font-size:12px;color:#8f8aa5;text-align:right}
.done{display:none;text-align:center;gap:8px}
.done p{margin:0}
.panel.released .make{display:none}
.panel.released .done{display:grid}
#pick,#wardrobe{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,22,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:5;padding:12px}
#pick[hidden],#wardrobe[hidden]{display:none}
.card{background:#0e1236;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
.card h2{margin:0 0 4px;font-size:24px;line-height:1.15}
.card p{margin:0 0 16px;color:var(--mute);font-size:14px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.role{display:grid;justify-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font:17px Mitr,sans-serif}
.role img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#2a2f5a}
.role:hover,.role:focus-visible{border-color:var(--gold);outline:none}
#wardrobe .card{max-width:480px;max-height:100%;overflow:auto;padding:18px}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:8px}
.skin{position:relative;display:grid;justify-items:center;gap:6px;padding:10px 6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 50% 35%,rgba(243,196,107,.16),rgba(255,255,255,.03) 70%);color:var(--ink);cursor:pointer;font:16px Mitr,sans-serif}
.skin img{height:clamp(150px,34vh,280px);width:100%;object-fit:contain;transition:transform .25s}
.skin:hover img{transform:translateY(-3px)}
.skin[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(243,196,107,.25)}
.skin .tag{position:absolute;top:8px;right:8px;font:12px "IBM Plex Sans Thai",sans-serif;background:var(--gold);color:#2b1704;border-radius:99px;padding:1px 8px;display:none}
.skin[aria-pressed=true] .tag{display:block}
.skin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.links{display:flex;gap:12px;flex:none;align-items:center}
.dressBtn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:3px 14px 3px 3px;border-radius:99px;border:1px solid var(--gold);background:rgba(243,196,107,.14);color:#ffe2a0;font:15px Mitr,sans-serif;cursor:pointer;white-space:nowrap}
.dressBtn img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#2a2f5a}
.dressBtn:hover{background:rgba(243,196,107,.24)}
.dressBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{flex-wrap:wrap}
.note{font-size:12px;color:#8f8aa5;margin-top:14px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.wish textarea{height:48px}
.wait{display:none;text-align:center;gap:8px}
.wait p{margin:0}
.panel.waiting .make{display:none}
.panel.waiting .wait{display:grid}
.panel.released .wait{display:none}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(243,196,107,.25),0 4px 24px rgba(243,196,107,.55)}}
#stage.letters .top{opacity:.15}
#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:500 clamp(84px,24vw,190px)/1 Mitr,sans-serif;color:#ffe2a0;text-shadow:0 0 30px rgba(255,190,90,.8),0 0 80px rgba(255,160,60,.5);opacity:0;transition:opacity .25s}
#count.show{opacity:1}
#count span{display:block;animation:pop .9s ease-out both}
@keyframes pop{from{transform:scale(1.6);opacity:0}25%{opacity:1}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.btn.pulse,#count span{animation:none}}
@media(max-width:600px){.top p{display:none}.chip{font-size:12px;padding:3px 9px 3px 3px;gap:5px}.chip img{width:22px;height:22px}.who{flex-direction:column;align-items:flex-end;gap:5px}.kinds{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding-inline:max(4vw,14px);margin-inline:calc(-1*max(4vw,14px));padding-inline:max(4vw,14px)}.kinds::-webkit-scrollbar{display:none}.kind{flex:0 0 calc((100% - 18px)/4.4);scroll-snap-align:start}.btn{padding:0 14px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="ภาพแม่น้ำเจ้าพระยายามค่ำ วัดอรุณ พระจันทร์เต็มดวง และกระทงที่ลอยอยู่"></canvas>
  <div class="top">
    <div><h1>ลอยกระทงด้วยกัน</h1><p>ท่าน้ำฝั่งตรงข้ามวัดอรุณ · คืนพระจันทร์เต็มดวง</p></div>
    <div class="who" id="who"></div>
  </div>
  <div id="bubble"></div>
  <div id="count" aria-live="assertive"></div>
  <div id="wardrobe" hidden>
    <div class="card">
      <h2 id="wdTitle">เลือกชุด</h2>
      <p>เปลี่ยนแล้วใส่ทันที อีกคนก็เห็นชุดใหม่ด้วย</p>
      <div class="skins" id="skins"></div>
      <button class="link" id="wdClose">ปิด</button>
    </div>
  </div>

  for(const b of document.querySelectorAll(".kind"))b.setAttribute("aria-pressed",String(me.design===b.dataset.k));
  if(document.activeElement!==$("#wish"))$("#wish").value=me.wish||"";
  for(const im of document.querySelectorAll(".dressImg"))if(me.role){const src=SK[me.role][me.skin]?SK[me.role][me.skin].src.head:SK[me.role].casual.src.head;if(im.getAttribute("src")!==src)im.src=src}
  if(me.role){
    const os=others(me.role),st=r=>stateOf(r)||{},names=a=>a.map(r=>NAME[r]).join(" กับ ");
    const onl=os.filter(r=>online[r]),known=os.filter(r=>online[r]||stateOf(r));
    const unrelOnl=onl.filter(r=>!st(r).rel),readyOnes=unrelOnl.filter(r=>st(r).ready),target=known.filter(r=>!st(r).rel);
    const hello=$("#hello"),hb=document.createElement("b");hello.innerHTML="";
    if(Date.now()<noteUntil){hb.textContent=note;hello.append(hb)}
    else if(readyOnes.length&&!me.ready){hb.textContent=`${names(readyOnes)}พร้อมแล้ว`;hello.append(hb,` · กด "ลอยพร้อมกัน" ได้เลย`)}
    else{hb.textContent=NAME[me.role];hello.append("กระทงของ ",hb," · เลือกแบบ แล้วเขียนคำอธิษฐาน")}
    const g=pairGroup(),inG=!!(g&&g.roles.includes(me.role)),relO=known.filter(r=>st(r).rel);
    $("#doneMsg").textContent=inG?`ลอยพร้อมกันแล้ว กระทงของ${names(g.roles)}ผูกไว้ด้วยกัน${target.length?` รอ${names(target)}มาลอยตามนะ`:""} แตะกระทงของตัวเองเพื่ออ่านคำอธิษฐาน`
      :relO.length?`กระทงของ${names([me.role,...relO])}ลอยอยู่ด้วยกันแล้ว${target.length?` รอ${names(target)}มาลอยตามนะ`:""} แตะกระทงของตัวเองเพื่ออ่านคำอธิษฐาน`
      :`กระทงของ${NAME[me.role]}ลอยออกไปแล้ว${target.length?` รอ${names(target)}มาลอยตามนะ`:""}`;
    const tg=$("#together"),allGone=known.length>0&&target.length===0;
    tg.textContent=allGone?`${names(relO)}ลอยไปแล้ว`:target.length===1?`ลอยพร้อม${NAME[target[0]]} ♥`:"ลอยพร้อมกัน ♥";
    tg.disabled=allGone;tg.classList.toggle("pulse",readyOnes.length>0&&!me.ready);
    const notReady=unrelOnl.filter(r=>!st(r).ready),away=target.filter(r=>!online[r]);
    $("#waitMsg").textContent=lockedT?"นับถอยหลัง ลอยพร้อมกันนะ…"
      :notReady.length?`รอ${names(notReady)}กด "ลอยพร้อมกัน"…`
      :away.length?`รอ${names(away)}กด "ลอยพร้อมกัน"… ตอนนี้ยังไม่ได้เปิดแอป`
      :`รอคนอื่นมากด "ลอยพร้อมกัน"…`;
    $("#cancel").hidden=!!lockedT;}
  $("#who").innerHTML=ROLES.filter(r=>r!=="tan"||me.role==="tan"||online.tan||stateOf("tan")).map(r=>{const st=stateOf(r),here=online[r]||r===me.role;
    const tag=st&&st.rel?"ลอยแล้ว":here&&st&&st.ready?"พร้อมลอย":here?"อยู่ริมน้ำ":"ยังไม่มา";
    return `<span class="chip"><img alt="" src="${SK[r][skinOf(r)].src.head}"><span class="dot ${here?"on":""}"></span>${NAME[r]} · ${tag}</span>`}).join("");
}
function save(){saveLocal();publish();renderPanel()}
function pairGroup(){ // the latest set of 2+ people whose krathongs went on the same count
  const by={};for(const r of ORDER){const s=stateOf(r);if(s&&s.rel&&s.pair&&Math.abs(s.rel-s.pair)<1){const k=Math.round(s.pair);(by[k]=by[k]||[]).push(r)}}
  let best=null;for(const k in by)if(by[k].length>=2&&(!best||+k>best.t))best={t:+k,roles:by[k]};return best}

/* ---------- release together: both press, both screens count 3-2-1, both krathongs go at the same instant ---------- */
let lockedT=null,countHideAt=0;
function setCount(txt){const el=$("#count");
  if(!txt){if(Date.now()>countHideAt){el.classList.remove("show");el.dataset.v=""}return}
  if(el.dataset.v!==txt){el.dataset.v=txt;el.innerHTML="";const sp=document.createElement("span");sp.textContent=txt;el.append(sp)}
  el.classList.add("show")}
function togetherTick(){
  const now=Date.now();
  if(!me.role||me.rel||!me.ready){lockedT=null;setCount("");return}
  const os=others(me.role),st=r=>stateOf(r)||{};
  // someone already went on a shared count that included me: follow the earliest such count
  for(const r of os){const s=st(r);if(s.pair&&s.rel===s.pair&&s.pair>me.ready&&now-s.pair<60000&&(!lockedT||s.pair<lockedT)){lockedT=s.pair;renderPanel()}}
  if(!lockedT){
    const active=os.filter(r=>online[r]&&!st(r).rel); // here and still holding a krathong
    if(active.length&&active.every(r=>st(r).ready)){lockedT=Math.max(me.ready,...active.map(r=>st(r).ready))+4000;renderPanel()}
    else{const onl=os.filter(r=>online[r]),pendingAway=os.some(r=>!online[r]&&stateOf(r)&&!st(r).rel);
      if(onl.length&&onl.every(r=>st(r).rel)&&!pendingAway){ // everyone here already floated theirs alone: stop waiting
        me.ready=null;note=`${onl.map(r=>NAME[r]).join(" กับ ")}ลอยไปก่อนแล้ว ลอยตามได้เลยนะ`;noteUntil=now+8000;save();setTimeout(renderPanel,8100);return}}
  }
  if(!lockedT)return;
  const left=lockedT-now;
  if(left<=0){me.rel=lockedT;me.pair=lockedT;me.ready=null;lockedT=null;countHideAt=Date.now()+1100;setCount("ลอย!");save();persist();showBubble(me.role,5000);return}
  setCount(String(Math.ceil(left/1000)));
}
setInterval(togetherTick,100);
$("#kinds").addEventListener("click",e=>{const b=e.target.closest(".kind");if(!b||me.rel)return;me.design=b.dataset.k;save()});
let wishT=0;$("#wish").addEventListener("input",e=>{me.wish=e.target.value.slice(0,140);saveLocal()});
$("#go").addEventListener("click",()=>{if(!me.role){$("#pick").hidden=false;return}me.rel=Date.now();me.pair=null;me.ready=null;save();persist();showBubble(me.role,5000)});
$("#together").addEventListener("click",()=>{if(!me.role){$("#pick").hidden=false;return}me.ready=Date.now();me.pair=null;save()});
$("#cancel").addEventListener("click",()=>{if(lockedT)return;me.ready=null;save()});
$("#again").addEventListener("click",()=>{me.rel=null;me.pair=null;me.ready=null;me.wish="";save();persist()});
$("#swap").addEventListener("click",()=>{$("#pick").hidden=false});
function openWardrobe(){
  if(!me.role){$("#pick").hidden=false;return}
  $("#wdTitle").textContent="แต่งตัวให้"+NAME[me.role];
  $("#skins").innerHTML=SKINS[me.role].map(k=>`<button class="skin" data-skin="${k.id}" aria-pressed="${me.skin===k.id}"><span class="tag">ใส่อยู่</span><img alt="" src="${k.front}">${k.name}</button>`).join("");
  $("#wardrobe").hidden=false;
}
$("#dress").addEventListener("click",openWardrobe);$("#dress2").addEventListener("click",openWardrobe);
$("#wdClose").addEventListener("click",()=>{$("#wardrobe").hidden=true});
$("#skins").addEventListener("click",e=>{const b=e.target.closest(".skin");if(!b)return;
  if(me.skin!==b.dataset.skin){me.skin=b.dataset.skin;save();persist()}
  $("#wardrobe").hidden=true});
for(const b of document.querySelectorAll(".role"))b.addEventListener("click",()=>{
  const r=b.dataset.role,prev=me.role;$("#pick").hidden=true;
  if(r===prev)return;
  if(prev)mqOffline(prev);
  lockedT=null;loadRole(r);save();showSelectedKind();
  if(useMq)mqConnect();
  if(SKINS[r].length>1)openWardrobe();
});

/* ---------- sync: only krathong design + release time travel; wishes never leave this device ---------- */
function clean(v){if(!v||typeof v!=="object")return null;const num=x=>typeof x==="number"&&isFinite(x)&&x<Date.now()+6e4?x:null;
  return{design:KIND[v.design]?v.design:"lotus",skin:SKIN_IDS.includes(v.skin)?v.skin:"casual",rel:num(v.rel),ready:num(v.ready),pair:num(v.pair)}}
function publish(){
  if(room&&me.role)room.presence({lk:{role:me.role,design:me.design,skin:me.skin,rel:me.rel,ready:me.ready||null,pair:me.pair||null}}).catch(()=>{});
  mqPublish();
}
let writing=Promise.resolve();
function persist(){if(!db||!me.role)return;const data={design:me.design,skin:me.skin,rel:me.rel,pair:me.pair||null};
  writing=writing.then(()=>db.doc("krathong/"+me.role).set(data)).catch(()=>{})}

/* on claude.ai: room + db.  anywhere else (GitHub Pages): a public MQTT relay */
const ROOM_CODE="e48ee56b04190cb50b3a",TOPIC="lktg/"+ROOM_CODE;
const BROKERS=(()=>{const q=new URLSearchParams(location.search).get("broker");return q?[q]:["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081/mqtt"]})();
const seen={pete:0,aoom:0,tan:0};
let mq=null;
function mqPublish(){
  if(!mq||!me.role)return;
  mq.publish(TOPIC+"/state/"+me.role,JSON.stringify({design:me.design,skin:me.skin,rel:me.rel,ready:me.ready||null,pair:me.pair||null}),{retain:true,qos:1});
  mq.publish(TOPIC+"/online/"+me.role,JSON.stringify({ts:Date.now()}),{retain:true,qos:0});
}
let useMq=false,mqGen=0,mqRole=null;
function mqOffline(r){if(mq&&r)mq.publish(TOPIC+"/online/"+r,JSON.stringify({ts:0}),{retain:true,qos:0})}
function mqConnect(){
  if(!window.mqtt||!me.role)return;
  const gen=++mqGen;
  if(mq){const old=mq;mq=null;try{old.end(false)}catch(e){}}
  let i=0;
  const tryNext=()=>{
    if(gen!==mqGen)return;
    const url=BROKERS[i++%BROKERS.length],role=me.role;let done=false;
    const c=mqtt.connect(url,{clientId:"lk_"+Math.random().toString(16).slice(2,12),clean:true,connectTimeout:7000,reconnectPeriod:0,keepalive:20,
      will:{topic:TOPIC+"/online/"+role,payload:JSON.stringify({ts:0}),retain:true,qos:0}});
    const next=()=>{if(done)return;done=true;if(mq===c)mq=null;try{c.end(true)}catch(e){}
      if(gen!==mqGen)return;renderPanel();setTimeout(tryNext,i%BROKERS.length?300:4000)};
    c.on("connect",()=>{if(gen!==mqGen){c.end(true);return}mq=c;mqRole=role;c.subscribe(TOPIC+"/#",{qos:1});mqPublish()});
    c.on("message",(topic,buf,packet)=>{
      if(gen!==mqGen)return;
      const parts=topic.split("/"),kind=parts[2],r=parts[3];if(!(r in remote)||r===me.role)return;
      let v=null;try{v=JSON.parse(buf.toString())}catch(e){return}
      if(kind==="state")remote[r]=clean(v);
      if(kind==="online"&&v&&typeof v.ts==="number"){
        // a live heartbeat counts from when it arrived; a stored one only if it is recent
        const alive=v.ts>0&&(!(packet&&packet.retain)||Math.abs(Date.now()-v.ts)<50000);
        seen[r]=alive?Date.now():0;online[r]=alive}
      renderPanel();
    });
    c.on("error",next);c.on("close",next);
  };
  tryNext();
}
function startMqtt(){
  if(!window.mqtt){if(document.readyState!=="complete")addEventListener("load",startMqtt,{once:true});return}
  if(useMq)return;useMq=true;
  if(me.role)mqConnect();
  setInterval(mqPublish,15000);
  setInterval(()=>{let ch=false;for(const r in seen){const on=seen[r]>0&&Date.now()-seen[r]<45000;if(online[r]!==on){online[r]=on;ch=true}}if(ch)renderPanel()},3000);
  addEventListener("pagehide",()=>{mqOffline(me.role)});
}

(async()=>{
  try{db=await claude.use("db")}catch(e){db=null}
  if(db){db.collection("krathong").onSnapshot(s=>{remote.pete=null;remote.aoom=null;for(const d of s.docs)if(d.id in remote)remote[d.id]=clean(d.data());renderPanel()},()=>{})}
})();
(async()=>{
  try{room=await claude.use("room")}catch(e){room=null}
  if(!room){startMqtt();return}
  room.onPeers(ch=>{live.pete=live.aoom=null;online.pete=online.aoom=false;
    for(const p of ch.peers){if(p.sameTab)continue;const v=p.presence&&p.presence.lk;if(!v||!(v.role in live))continue;
      online[v.role]=true;live[v.role]=clean(v)}
    renderPanel()},()=>{});
  publish();
})();

$("#pick").hidden=false;
renderKinds();renderPanel();requestAnimationFrame(frame);
}
